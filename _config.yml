# Site configuration
title: LLM
author: Yao Jun
description: Personal learning resource hub, organizing CMU 15-445 Database Systems course materials by semester.
lang: en

# If deploying to GitHub Pages project page (e.g. username.github.io/dbb/), change baseurl to "/dbb"
baseurl: ""
url: ""

# Markdown rendering: Jekyll 3.x uses kramdown + GFM (requires kramdown-parser-gfm gem)
markdown: kramdown
kramdown:
  input: GFM

# Semester collection: each file under _semesters/ auto-generates a page
collections:
  semesters:
    output: true

# Default Front Matter
defaults:
  - scope:
      path: "_semesters"
      type: semesters
    values:
      layout: semester

# Build output
destination: _site
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - .codebuddy
