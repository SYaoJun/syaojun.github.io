---
layout: default
---

<article class="blog-post">
  <header class="blog-post-header">
    <h1>{{ page.title }}</h1>
    <time class="blog-post-date" datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%Y-%m-%d" }}
    </time>
  </header>

  <div class="blog-post-content">
    {{ content }}
  </div>
</article>
